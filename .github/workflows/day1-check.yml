name: Day 1 Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          set -euo pipefail
          echo "=== Checking files ==="
          MISSING=0
          for f in README.md docs/analysis.md docs/requirements.md docs/tz.md docs/stakeholders.md; do
            if [ -f "$f" ]; then
              SIZE=$(wc -m < "$f")
              if [ "$SIZE" -lt 500 ]; then
                echo "FAIL: $f is too small ($SIZE chars, need >= 500)"
                MISSING=1
              else
                echo "PASS: $f found ($SIZE chars)"
              fi
            else
              echo "FAIL: $f not found"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: All required files OK"

      - name: Check User Stories
        run: |
          set -euo pipefail
          COUNT=$(grep -cE "Как .+, я хочу" docs/requirements.md || true)
          echo "User Stories found: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "FAIL: need >= 10 User Stories"
            exit 1
          fi
          echo "PASS: User Stories OK"

      - name: Check NFR
        run: |
          set -euo pipefail
          COUNT=$(grep -c "NFR-" docs/requirements.md || true)
          echo "NFR found: $COUNT"
          if [ "$COUNT" -lt 5 ]; then
            echo "FAIL: need >= 5 NFR"
            exit 1
          fi
          echo "PASS: NFR OK"

      - name: Check TZ sections
        run: |
          set -euo pipefail
          MISSING=0
          for section in "Назначение" "предметной области" "функци" "качеств" "интерфей" "данны" "стек" "Ограничен"; do
            if ! grep -qiF "$section" docs/tz.md; then
              echo "FAIL: section '$section' not found in tz.md"
              MISSING=1
            else
              echo "PASS: section '$section' found"
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: All TZ sections found"

      - name: Check entities
        run: |
          set -euo pipefail
          COUNT=$(grep -cE '^\| *[A-Za-zА-Яа-я]' docs/analysis.md || true)
          echo "Entity rows found: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "FAIL: need more entities in analysis.md (>= 10)"
            exit 1
          fi
          echo "PASS: Entities OK"

      - name: All checks passed
        run: echo "ALL CHECKS PASSED"
